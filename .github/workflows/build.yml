name: Build BomSearch Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod tidy

      - name: Build static windows amd64 exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w" -o BomSearch.exe main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BomSearch-Win10-amd64
          path: BomSearch.exe
