name: Build BomSearch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux]
        goarch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build -ldflags "-s -w" -o BomSearch${EXT} main.go

      - name: Upload ${{ matrix.goos }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: BomSearch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            BomSearch
            BomSearch.exe
